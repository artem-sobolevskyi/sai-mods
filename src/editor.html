<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mod — SAI Mods</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <main class="page">
    <div class="page-head">
      <div>
        <button id="back" class="back" type="button">← All mods</button>
        <h1 id="title">New mod</h1>
      </div>
      <label class="switch" title="Enable mod">
        <input id="enabled" type="checkbox" checked>
        <span></span>
      </label>
    </div>

    <p id="message" hidden></p>

    <form id="form">
      <div class="field">
        <label for="name">Name</label>
        <input id="name" type="text" maxlength="80" placeholder="For example, quiet sidebar" required>
      </div>
      <div class="field">
        <label for="matches">Where it runs</label>
        <textarea id="matches" spellcheck="false" placeholder="music.youtube.com&#10;*://example.com/*"></textarea>
        <p class="hint">One site per line. A domain such as music.youtube.com, or a pattern like *://example.com/*.</p>
      </div>
      <div class="field">
        <label for="css">CSS</label>
        <textarea id="css" spellcheck="false" placeholder="body { background: #111; }"></textarea>
      </div>
      <div class="field">
        <label for="js">JavaScript</label>
        <textarea id="js" spellcheck="false" placeholder="document.body.style.outline = '2px solid red';"></textarea>
        <p class="hint">Optional. The script runs on the sites above after you save and reload the tab. Turn on Allow user scripts at chrome://extensions first.</p>
      </div>
      <label class="check">
        <input id="mainWorld" type="checkbox">
        <span>Run JavaScript in the page context. Use this when the code needs to call the site’s own scripts.</span>
      </label>
      <div class="row-actions">
        <button class="primary" type="submit">Save</button>
        <button id="remove" class="danger" type="button" hidden>Delete</button>
      </div>
    </form>
  </main>
  <script src="shared.js"></script>
  <script src="editor.js"></script>
</body>
</html>
